# Métadonnées normalisées du logiciel, standard publiccode.yml v0.7
# (https://yml.publiccode.tools). Ce fichier est lu par les catalogues publics
# de logiciels libres : il décrit le sas une fois pour toutes, dans un format
# que les annuaires savent moissonner, plutôt qu'une fiche à ressaisir partout.
#
# Deux choix à ne pas défaire sans raison :
#   - developmentStatus reste "beta" tant que le périmètre est la V1 locale
#     mono-poste. Annoncer "stable" contredirait le bandeau de maturité du
#     README, de l'accueil du site et de SECURITY.md.
#   - la catégorie "compliance-management" est volontairement absente : le sas
#     réduit les données transmises et rend les flux vérifiables, il ne met
#     personne en conformité, et une catégorie mal choisie promet à sa place.
